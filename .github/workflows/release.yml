name: Release 2Do for Windows MCP
run-name: ${{ inputs.verify_tag && format('Verify published release {0}', inputs.verify_tag) || format('Release {0}', github.ref_name) }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      verify_tag:
        description: Published version to check
        required: true
        type: string
concurrency:
  group: windows-mcp-release-${{ inputs.verify_tag || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Publish or verify the versioned MCP bundle
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_TAG: ${{ inputs.verify_tag }}
        run: node scripts/publish.mjs
